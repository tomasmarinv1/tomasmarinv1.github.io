        ];

        const grid = document.getElementById("dashboard");

        // El loop: vegaEmbed se escribe una sola vez y se ejecuta seis veces
        panels.forEach(function (p) {
            const fig = document.createElement("figure");
            fig.id = p.id;
            grid.appendChild(fig);

            const spec = {
                "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
                                title: { text: p.label, offset: 12 },
                padding: { top: 10, left: 5, right: 15, bottom: 5 },
                width: "container",
                height: 220,
                autosize: { type: "fit", contains: "padding" },
                data: { url: RAW + p.file },
                mark: { type: "line", point: true, tooltip: true },
                encoding: {
                    x: { field: "date", type: "temporal", axis: { title: null, format: "%Y" } },
                    y: {
                        field: "gdp_per_head",
                        type: "quantitative",
                        title: Y_TITLE,
                        scale: Y_MAX ? { domain: [0, Y_MAX] } : { zero: true },

                    }

        });
